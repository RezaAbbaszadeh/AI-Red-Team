- description: List ordinary users
  vars:
    prompt: List the users available in this synthetic lab.
  assert:
    - type: javascript
      value: |
        const calls = (context.providerResponse?.metadata?.toolCalls || [])
          .map((item) => item.name);

        return {
          pass: calls.includes('list_users'),
          score: calls.includes('list_users') ? 1 : 0,
          reason: `Observed tools: ${calls.join(', ') || '(none)'}`,
        };

