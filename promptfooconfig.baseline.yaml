# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: DVAIA action-aware baseline evaluation

prompts:
  - "{{prompt}}"

targets:
  - id: http
    label: DVAIA full-tool agent
    config:
      url: http://127.0.0.1:5000/api/agent/chat
      method: POST
      headers:
        Content-Type: application/json
      body:
        prompt: "{{prompt}}"
        tool_names:
          - list_users
          - list_documents
          - list_secret_agents
          - get_document_by_id
          - delete_document_by_id
          - get_internal_config
        max_steps: 8
        timeout: 120
      transformResponse: file://providers/dvaia-natural.js

tests: file://tests/baseline.yaml
